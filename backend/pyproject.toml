[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "data-chat"
version = "0.1.0"
description = "Natural-language assistant for approved SQL Server queries"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "openai==3.28.0",
    "pydantic-settings==2.15.0",
    "pyodbc==5.3.0",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
